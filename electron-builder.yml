# electron-builder 配置：Windows 托盘工具
#
# 产物：release/WorkHub-Setup-<版本>.exe（安装程序）
# 免安装包是 release/workhub-tray-<版本>.zip：打包脚本把免安装目录改名为 workhub
# 之后打成 zip，所以 zip 顶层只有这一个目录（解压出来是「一个文件夹」）。
appId: com.workhub.tray
productName: WorkHub
copyright: WorkHub

directories:
  app: tray
  # 输出目录不能用 dist/——那是前端构建产物的地盘
  # （打包脚本会把它改到临时目录，避开 IDE 的目录改名钩子，最后再把安装包拷回 release/）
  output: release
  buildResources: build

# 托盘应用目录里的全部文件（main.cjs / icon.cjs / run-server.cjs / package.json）
files:
  - '**/*'
  # 托盘本体零第三方依赖。不排除的话，electron-builder 会按仓库根的 package.json
  # 把前端依赖（react、codemirror…）连同原生模块一起拖进安装包——白多几十兆。
  - '!node_modules/**/*'
  - '!**/node_modules/**/*'
  # 机器相关的配置不进包
  - '!tray.config.json'
  # 更新器脚本要放在 asar 外面（见 extraFiles），包里留一份就够了
  - '!apply-update.cjs'

asar: true

# 服务 payload：托盘要拉起的服务进程需要的一切（代码 + 前端产物 + 运行时依赖）
# 放在 asar 外面——服务进程是纯 Node 模式跑的，读不了 asar 里的文件
# （打包脚本会用实际组装的 payload 目录覆盖这一条，这里的写法只为看得懂）
extraResources:
  - from: release/.payload
    to: payload
  # 托盘自更新的更新器脚本：放在 resources\update\ 下（不在 asar 里）。
  #
  # 为什么不能塞进 asar：更新器是纯 Node 跑的（托盘自己的 Electron，
  # 用 ELECTRON_RUN_AS_NODE=1），它要读自己的脚本、还要在托盘退出后
  # 覆盖这个目录里的文件。
  # asar 里的文件是虚拟的，Node 之外的工具（以及覆盖操作）都够不着。
  #
  # 为什么不再直接扔在 exe 旁边：安装目录的根层只该有「入口 + Electron 运行时」，
  # 我们自己的东西一律收进 resources\——否则根目录里会躺着一个
  # 使用者看不懂、也不敢删的 js 文件。
  - from: tray/apply-update.cjs
    to: update/apply-update.cjs

# 安装目录根层只额外放一份说明：哪些是程序文件、哪些是使用者的数据、
# 数据默认在哪、怎么改。装完的人打开安装目录第一眼看到的就是它，
# 不然面对一屏 dll 和 pak，只能靠猜。
extraFiles:
  - from: tray/使用说明.txt
    to: 使用说明.txt

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: WorkHub-Setup-${version}.${ext}

nsis:
  # 辅助安装程序：给使用者一个「选择安装位置」的页面。
  # 一键安装（oneClick）没有这一页，文件只能落在固定目录，
  # 想装到别的盘的人只能自己去搬——搬完快捷方式和卸载入口都可能对不上。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: WorkHub
  # 卸载时保留用户数据（.env / 数据库），重装不丢东西
  deleteAppDataOnUninstall: false

# 只留中文和英文两种界面语言。
# Electron 默认把 50 多种语言包全塞进 locales/，装完在安装目录里铺一层
# 用不上的 .pak 文件——既占地方（十几 MB），又让人以为装坏了。
electronLanguages:
  - zh-CN
  - en-US
