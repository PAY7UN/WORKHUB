name: CI

# 每次推送与 PR 都跑一遍：类型、风格、单测、端到端自检。
# 端到端自检需要一份可用的库与仓库目录，这里用示例数据现场生成，
# 不依赖任何真实数据——仓库里的 data/ 本来就不该被提交。
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 24 起 .ts 可以直接跑（类型剥离），测试与自检脚本都依赖这一点
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npx tsc -b --pretty false

      - name: 代码风格
        run: npm run lint

      - name: 单元测试
        shell: bash
        run: |
          # 先落盘再看退出码：GitHub 的 bash 步骤默认 set -e，
          # `npm test | tee` 管道一失败脚本就退出了，后面的诊断根本跑不到。
          status=0
          npm test > /tmp/unit-test.log 2>&1 || status=$?
          cat /tmp/unit-test.log
          if [ "$status" -ne 0 ]; then
            # 失败原因写进注解：注解在 API 里是公开可读的，
            # 不用翻几百 MB 的 CI 日志才知道是哪条用例挂了、为什么挂。
            node scripts/ci/test-failure-summary.mjs /tmp/unit-test.log
          fi
          exit $status

      - name: 编译服务端（发布态入口）
        run: npm run build:server

      - name: 准备示例库与仓库目录
        shell: bash
        run: |
          # 自检脚本要复制一份「正在使用的库」再验证，所以先造一份出来：
          # 只导入 db.ts 就会建库、灌示例文档，并把正文写进仓库目录。
          node -e "console.log('WORKHUB_SECRET=' + require('crypto').randomBytes(32).toString('hex'))" > .env
          echo "WORKHUB_ADMIN_PASSWORD=CiCheck#2026a" >> .env
          # --env-file-if-exists 不能省：缺 WORKHUB_SECRET 时服务端会拒绝加载，
          # 那样连库都建不出来。
          WORKHUB_SEED_DEMO=1 node --env-file-if-exists=.env -e "import('./server/db.ts')"

      - name: 端到端自检
        run: npm run verify

  upgrade:
    # 升级链路只能在 Windows 上验：更新器要 taskkill 杀进程树、要 PowerShell
    # 解压、要建目录链接才能复现目标机上的目录形态。这些在 Linux 上没有对应物，
    # 硬凑只会验出一套假的环境。
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npx tsc -b --pretty false

      # 发布态真正被执行的是编译产物，升级链路得拿它来验，
      # 否则验的是「仓库形态」而不是「用户机器上的形态」
      - name: 编译服务端（发布态入口）
        run: npm run build:server

      - name: 升级链路自检
        run: npm run verify:upgrade

      # 打包这件事也得在 CI 里过一遍：发布包是「目标机零环境」的唯一保证，
      # 打包脚本坏了不能等到发版那天才发现。
      - name: 打服务端升级包并自检
        shell: pwsh
        run: |
          # 自带运行时直接用 CI 自己的 Node：版本跟依赖里的原生二进制对得上，
          # 也不用联网下载几十兆
          $env:WORKHUB_NODE_DIR = Split-Path -Parent (node -p "process.execPath")
          npm run pack:server -- --out release
          npm run pack:check

      # 托盘也要打一遍：托盘包既是「免安装版」的交付物，
      # 也是托盘自更新的原料（更新器按名字认这个包）。
      # 脚本坏在这里没人发现的话，要等到发版当天使用者才更新不了。
      - name: 打托盘包并自检
        shell: pwsh
        run: |
          # 打包失败时把日志尾巴写进注解：注解在 API 里是公开可读的，
          # 不用翻几百 MB 的 CI 日志才知道是哪一步炸的。
          $env:WORKHUB_NODE_DIR = Split-Path -Parent (node -p "process.execPath")
          npm run pack:tray 2>&1 | Tee-Object -FilePath 'tray-build.log'
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content 'tray-build.log' -Tail 40) -join "`n") -replace "`n", '%0A'
            Write-Host "::error title=托盘打包失败::$tail"
            exit $LASTEXITCODE
          }
          npm run pack:check
