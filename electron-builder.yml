# electron-builder 配置：Windows 托盘工具
#
# 产物：release/WorkHub-Setup-<版本>.exe（安装程序）
# 另有 release/win-unpacked/ 是免安装目录，可直接运行验证。
appId: com.workhub.tray
productName: WorkHub
copyright: WorkHub

directories:
  app: tray
  # 输出目录不能用 dist/——那是前端构建产物的地盘
  # （打包脚本会把它改到临时目录，避开 IDE 的目录改名钩子，最后再把安装包拷回 release/）
  output: release
  buildResources: build

# 托盘应用目录里的全部文件（main.cjs / icon.cjs / run-server.cjs / package.json）
files:
  - '**/*'
  # 托盘本体零第三方依赖。不排除的话，electron-builder 会按仓库根的 package.json
  # 把前端依赖（react、codemirror…）连同原生模块一起拖进安装包——白多几十兆。
  - '!node_modules/**/*'
  - '!**/node_modules/**/*'
  # 机器相关的配置不进包
  - '!tray.config.json'
  # 更新器脚本要放在 asar 外面（见 extraFiles），包里留一份就够了
  - '!apply-update.cjs'

asar: true

# 服务 payload：托盘要拉起的服务进程需要的一切（代码 + 前端产物 + 运行时依赖）
# 放在 asar 外面——服务进程是纯 Node 模式跑的，读不了 asar 里的文件
# （打包脚本会用实际组装的 payload 目录覆盖这一条，这里的写法只为看得懂）
extraResources:
  - from: release/.payload
    to: payload

# 托盘自更新的更新器脚本：放在 exe 旁边（不在 asar 里）。
#
# 为什么不能塞进 asar：更新器是用纯 Node 跑的（payload 自带的 node.exe），
# 它要读自己的脚本、还要在托盘退出后覆盖这个目录里的文件。
# asar 里的文件是虚拟的，Node 之外的工具（以及覆盖操作）都够不着。
extraFiles:
  - from: tray/apply-update.cjs
    to: apply-update.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: WorkHub-Setup-${version}.${ext}

nsis:
  # 一键安装：使用者双击就完事，不用研究装哪
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  shortcutName: WorkHub
  # 卸载时保留用户数据（.env / 数据库），重装不丢东西
  deleteAppDataOnUninstall: false
