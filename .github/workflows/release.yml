name: Release

# 发版：把服务端升级包打出来挂到 GitHub Release 上。
#
# 自动升级认的是资产名 workhub-server-<版本>.zip —— 名字对不上就等于没发，
# 而且用户那边看不出任何异常：界面只说「没有新版本」，因为压根没找到包。
# 所以打包、上传、版本号三件事必须成对出现。
on:
  release:
    types: [published]
  # 推 tag 即发版：发版不需要谁的 PAT，工作流用自带的 GITHUB_TOKEN 建 Release 并挂包。
  # 手动建好 Release 再发布（上面那条）也照样能走，两条路殊途同归。
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布到哪个 tag（如 v0.2.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    # 必须在 Windows 上打包：包里那份自带运行时是 Windows 的 node.exe，
    # 别的平台打不出目标机能用的运行时（依赖里的原生二进制也得跟运行时对得上）。
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史：没有 .github/release-notes/<tag>.md 时，说明文件由提交记录生成，
          # 只拉一层的话 git log 只剩一条提交，说明就成了一句话。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 版本对得上吗
        shell: pwsh
        env:
          # tag 名的三个来源，按优先级排：
          #   手动触发时的输入 → Release 事件里的 tag → 推 tag 事件里的 ref 名
          # 注意是 github.ref_name，不是 github.event.ref_name：
          # ref_name 是 github 上下文的属性，事件负载里没有这一项，
          # 写成 github.event.ref_name 只会取到空值，版本闸门会以为「不知道要发哪个 tag」。
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          # 用 ReadAllText 而不是 Get-Content：前者按 BOM 探测编码、无 BOM 时按 UTF-8 读，
          # 后者在 Windows PowerShell 5.1 下默认按 ANSI 读，package.json 里的中文会被读坏，
          # 坏掉的 JSON 解析不出来，这一步就停在「看不出版本号」上。
          $pkg = ([System.IO.File]::ReadAllText('package.json') | ConvertFrom-Json).version
          $tag = $env:TAG
          # 再兜一层：万一上面的表达式没取到，直接从 ref 里抠（推 tag 事件一定是这个形状）
          if (-not $tag -and $env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          }
          if (-not $tag) { throw '不知道要发到哪个 tag' }
          if ($pkg -ne ($tag -replace '^v', '')) {
            throw "tag 是 $tag，但 package.json 里是 $pkg；对不上就别发——自动升级是按包名里的版本号认版本的"
          }
          Write-Host "版本一致：$pkg（tag $tag）"

      - name: 打服务端升级包（自带 Node 运行时）
        shell: pwsh
        run: |
          $env:WORKHUB_NODE_DIR = Split-Path -Parent (node -p "process.execPath")
          npm run pack:server -- --out release

      - name: 打托盘包（安装程序 + 免安装版）
        shell: pwsh
        run: |
          $env:WORKHUB_NODE_DIR = Split-Path -Parent (node -p "process.execPath")
          npm run pack:tray

      - name: 包合格吗
        run: npm run pack:check

      - name: 准备 Release 说明
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          # 有 .github/release-notes/<tag>.md 就用它，没有就用提交记录兜底：
          # Release 正文空着不好，但也不能因为找不到说明文件就发不出去。
          $notes = Join-Path '.github\release-notes' "$env:TAG.md"
          if (Test-Path $notes) {
            Copy-Item $notes 'release-notes.md'
            Write-Host "用仓库里的说明：$notes"
          } else {
            git log --pretty=format:'- %s (%h)' -n 50 | Out-File -Encoding utf8 'release-notes.md'
            Write-Host '没有对应的说明文件，改用提交记录生成'
          }

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
          body_path: release-notes.md
          # 同一个 tag 重发一次（推 tag 建完 Release、又在网页上点一次发布）时，
          # 资产名会撞车；覆盖掉旧的，别让这一步把整条流水线带崩。
          overwrite_files: true
          # 资产名是自动升级的约定：服务端认 workhub-server-<版本>.zip，
          # 托盘认 workhub-tray-<版本>.zip。名字对不上就等于没发，
          # 而且用户那边看不出任何异常：界面只说「没有新版本」。
          files: |
            release/workhub-server-*.zip
            release/workhub-server-*.zip.sha256
            release/workhub-tray-*.zip
            release/workhub-tray-*.zip.sha256
            release/WorkHub-Setup-*.exe
